---

# This file is the place for cross-role defaults for all products, and
# common parameters from the infrastructure-deployment phase of the
# build (e.g. CloudFormation). Variables defined here will override
# those defined in `<role>/defaults/main.yml`, although defaults
# should usually be defined there too. For variable precedence
# information see:
#
#    https://docs.ansible.com/ansible/latest/user_guide/playbooks_variables.html


#
# Vars from environment
#
alb_access_logs_prefix: "{{ lookup('env', 'ALB_ACCESS_LOGS_PREFIX') }}"
aws_region: "{{ lookup('env', 'AWS_REGION') }}"
s3_bucket: "{{ lookup('env', 'S3_BUCKET') }}"
efs_path: "{{ lookup('env', 'EFS_PATH') }}"
proxy_name: "{{ lookup('env', 'PROXY_NAME') }}"
vpc_cidr: "{{ lookup('env', 'VPC_CIDR') }}"
alb_hosts: "{{ lookup('env', 'ALB_HOSTS') | split(' ') }}"

#
# Vars from environment with defaults
#
efs_mountpoint: "{{ lookup('env', 'EFS_MOUNTPOINT') | default('/goaccess_data', true) }}"
goaccess_parse_alb_logs_cron_minutes: "{{ lookup('env', 'GOACCESS_PARSE_ALB_LOGS_CRON_MINUTES') | default('0,30', true) }}"
nginx_allowed_cidr: "{{ lookup('env', 'NGINX_ALLOWED_CIDR') | default('128.117.0.0/16', true) }}"

#
# Derived globals
# 
goaccess_db_root: "{{ efs_mountpoint }}/goaccess_db"
goaccess_last_key_file: "{{ efs_mountpoint }}/last_key"
web_root: "{{ efs_mountpoint }}/www"

# Unbound
#

# Where unbound forwards DNS requests to for ucar.edu
atl_unbound_ucar_forward: 8.8.8.8

# Where unbound forwards DNS requests to generally
atl_unbound_forward: 10.0.0.2


#
# Checkmk server
#
# https://github.com/Checkmk/ansible-collection-checkmk.general/blob/main/roles/server/defaults/main.yml
checkmk_server_ports:
  - 80
  - 8001

checkmk_registration_secret_arn: "{{ lookup('env', 'CHECKMK_REGISTRATION_SECRET_ARN') }}"
checkmk_registration_credential: "{{ lookup('amazon.aws.aws_secret', checkmk_registration_secret_arn, on_denied='error')}}"
checkmk_registration_user: "{{ checkmk_registration_credential | json_query('user') }}"
checkmk_registration_password: "{{ checkmk_registration_credential | json_query('password') }}"

#
# Checkmk agent
# https://galaxy.ansible.com/ui/repo/published/checkmk/general/content/role/agent/
#
checkmk_agent_version: "{{ checkmk_server_version }}"
checkmk_agent_edition: cre
checkmk_agent_server_protocol: http
checkmk_agent_server: "{{ ansible_facts['hostname'] }}"

#checkmk_agent_server_port: 8001

checkmk_agent_server_validate_certs: false
checkmk_agent_site: checkmk

checkmk_registration_secret_arn: "{{ lookup('env', 'CHECKMK_REGISTRATION_SECRET_ARN') }}"
checkmk_registration_credential: "{{ lookup('amazon.aws.aws_secret', checkmk_registration_secret_arn, on_denied='error') | from_json }}"
checkmk_agent_user: "{{ checkmk_registration_credential['user'] }}"
checkmk_agent_secret: "{{ checkmk_registration_credential['password'] }}"
checkmk_server_url: "{{ checkmk_agent_server_protocol }}://{{ checkmk_agent_server }}"

checkmk_agent_auto_activate: true
checkmk_agent_force_foreign_changes: true
checkmk_agent_add_host: true
checkmk_agent_host_name: "{{ ansible_facts['nodename'] }}"
checkmk_agent_folder: "/{{ atl_proxy_name | split('.') | first }}"
checkmk_agent_discover: true
checkmk_agent_mode: pull

# FIXME needs to be set up on server
checkmk_agent_update: false

checkmk_agent_tls: false
checkmk_agent_force_install: false

# False for debugging
checkmk_agent_no_log: false

# This breaks atlassian unless we specify ports somewhere
checkmk_agent_configure_firewall: false

# FIXME check this works
checkmk_agent_host_attributes:
  alias: "{{ proxy_name | split('.') | first }} ec2"



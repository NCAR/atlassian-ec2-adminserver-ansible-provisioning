- name: Create checkmk service folder
  checkmk.general.folder:
    path: "{{ checkmk_agent_folder }}"
    server_url: "{{ checkmk_server_url }}"
    site: "{{ checkmk_agent_site }}"
    api_user: "{{ checkmk_agent_user }}"
    api_secret: "{{ checkmk_agent_secret }}"
    validate_certs: false

- name: Create checkmk active check for the web site
  checkmk.general.rule:
    server_url: "{{ checkmk_server_url }}"
    site: "{{ checkmk_agent_site }}"
    api_user: "{{ checkmk_agent_user }}"
    api_secret: "{{ checkmk_agent_secret }}"
    validate_certs: false
    ruleset: "active_checks:httpv2"
    rule:
      conditions:
        host_name:
          match_on:
            - "{{ ansible_facts.hostname }}"
          operator: "one_of"
        host_tags: []
        host_labels: []
        service_labels: []
      properties:
        description: "HTTP Check"
        comment: "Managed by Ansible"
        disabled: false
      value_raw: "{'endpoints': [{'service_name': {'prefix': 'auto', 'name': '{{ proxy_name }}'}, 'url': 'https://{{ proxy_name }}'}], 'standard_settings': {}}"
      location:
        folder: "{{ checkmk_agent_folder }}"
#        position: "top"
    state: "present"
  
- name: Import checkmk agent role
  ansible.builtin.import_role:
    name: checkmk.general.agent

- name: Install checkmk plugin upgradeable_packages
  ansible.builtin.copy:
    src: upgradeable_packages.pl
    dest: /usr/lib/check_mk_agent/local/upgradeable_packages.pl
    mode: '0500'

- name: Install checkmk plugin upgradeable_snap_packages
  ansible.builtin.copy:
    src: upgradeable_snap_packages.sh
    dest: /usr/lib/check_mk_agent/local/upgradeable_snap_packages.sh
    mode: '0500'

- name: Fact for apt plugin interval directory path
  ansible.builtin.set_fact:
    mk_apt_directory: "/usr/lib/check_mk_agent/plugins/{{ checkmk_agent_apt_plugin_interval }}"
    
- name: Create plugin interval directory for apt plugin 
  ansible.builtin.file:
    path: "{{ mk_apt_directory }}"
    state: directory
    mode: '0755'

- name: Register status of mk_apt plugin file
  ansible.builtin.stat:
    path: /usr/lib/check_mk_agent/plugins/mk_apt
  register: mk_apt_plugin
    
- name: Install mk_apt plugin file
  ansible.builtin.get_url:
    url: "{{ checkmk_server_url }}/{{ checkmk_agent_site }}/check_mk/agents/plugins/mk_apt"
    dest: "{{ mk_apt_directory }}/mk_apt"
    mode: '0750'
  when: not mk_apt_plugin.stat.exists

# USE MK_APT INSTEAD
- name: Delete obsolete plugin upgradeable_packages.pl
  ansible.builtin.file:
    path: /usr/lib/check_mk_agent/local/upgradeable_packages.pl
    state: absent
  
- name: Invalidate mk_apt cache after package installs
  ansible.builtin.copy:
    src: 98mk-apt
    dest: /etc/apt/apt.conf.d/98mk-apt

---

# Gather EC2 metadata facts
- name: Fetch local EC2 metadata
  amazon.aws.ec2_metadata_facts:
    metadata_token_ttl_seconds: 120
  tags:
    - notest

- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto
    
- name: Install amazon-efs-utils package
  ansible.builtin.shell: '/usr/bin/curl https://amazon-efs-utils.aws.com/efs-utils-installer.sh | sudo sh -s -- --install'
  when: "'amazon-efs-utils' not in ansible_facts.packages"
  
- name: Create mountpoint
  ansible.builtin.file:
    state: directory
    path: "{{ efs_mountpoint }}"
    mode: 0755

- name: Enable mountpoint in fstab
  ansible.posix.mount:
    path: "{{ efs_mountpoint }}"
    src: "{{ efs_path }}"
    fstype: "{{ efs_type }}"
    opts: "{{ efs_mount_options }}"
    state: mounted

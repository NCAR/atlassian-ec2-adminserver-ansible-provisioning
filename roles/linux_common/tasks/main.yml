---

- name: Install common Ubuntu support packages
  ansible.builtin.apt:
    name:
      - amazon-ec2-utils
      - curl
      - fontconfig
      - git
      - jq
      - net-tools
      - tar

- name: Disable unneeded services
  ansible.builtin.include_tasks:
    file: disable_unnecessary_services.yml
      
- name: Customizations for root .bashrc
  ansible.builtin.blockinfile:
     path: /root/.bashrc
     append_newline: true
     prepend_newline: true
     marker: "### {mark} ANSIBLE MANAGED BLOCK ###"
     block: |
       #
       # Source user data env vars into environment for subsequent ansible runs
       #
       # If the instance has been redeployed, e.g. to change instance
       # type, current user-data.txt will be empty so we hunt for
       # whatever we can find from previous instances and hope for the
       # best
       tmpfile=$(mktemp) 
       grep export /var/lib/cloud/instance/user-data.txt > $tmpfile
       if ! test -s $tmpfile; then
           grep -h '^export' /var/lib/cloud/instances/*/user-data.txt | sort -u > $tmpfile
       fi
       source $tmpfile
       rm $tmpfile
       
       # Alias to run ansible
       alias run_ansible='(cd /var/ansible/atlassian-ec2-adminserver-ansible-provisioning \
       && git pull \
       && ansible-galaxy collection install --requirements-file requirements.yml \
       && for pb in $PLAYBOOKS; do ansible-playbook -i inv/aws_node_local $pb; done)'

- name: Set needrestart default mode to list
  ansible.builtin.copy:
    content: "# Created by ansible\n$nrconf{restart} = 'l';\n"
    dest: /etc/needrestart/conf.d/list_mode_default.conf

# Primarily to be run via ssm
- name: Script to upgrade all packages, restart services and reboot if necessary
  ansible.builtin.copy:
    src: upgrade_all.sh
    dest: /usr/local/bin/upgrade_all.sh
    owner: root
    group: root
    mode: "750" 

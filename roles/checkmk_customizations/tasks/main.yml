---

# Periods are not allowed in folder names
- name: "Create folders per ALB host"
  checkmk.general.folder:
    server_url: "http://{{ ansible_facts['fqdn'] }}/"
    site: checkmk
    api_user: agent_registration
    api_secret: "{{ checkmk_registration_user_secret }}"
    path: "/{{ item | split('.') | first }}"
    name: "{{ item | split('.') | first }}"
    state: present
  loop: "{{ alb_hosts }}"


# FIXME should this be a handler?
- name: "Start activation including foreign changes."
  checkmk.general.activation:
    server_url: "http://{{ ansible_facts['fqdn'] }}/"
    site: checkmk
    api_user: agent_registration
    api_secret: "{{ checkmk_registration_user_secret }}"
    force_foreign_changes: true


- name: Create checkmk registration user
  checkmk.general.user:
    server_url: "http://localhost/"
    site: checkmk
    api_user: "{{ checkmk_registration_user }}"
    api_secret: "{{ checkmk_registration_password }}"
    name: "{{ checkmk_registration_user }}"
    fullname: "{{ checkmk_registration_user }}"
    auth_type: "automation"
    password: "{{ checkmk_registration_password }}"
    roles:
      - "admin"
    state: "present"
